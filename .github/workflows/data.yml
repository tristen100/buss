# Every Monday night: rebuild the timetable (Tallinn + national GTFS) and the stops' real walks, check them, and deploy
# when something changed. The street network itself (OpenStreetMap) is rebuilt on the first Monday of the month.
# Needs repository secrets CLOUDFLARE_API_TOKEN (Workers deploy) and CLOUDFLARE_ACCOUNT_ID.
name: Timetable update
on:
  schedule: [{ cron: "30 1 * * 1" }]
  workflow_dispatch: {}
permissions: { contents: write }
concurrency: { group: data, cancel-in-progress: false }
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Timetable
        run: node tools/build-data.mjs
      - name: Street network (first Monday of the month)
        continue-on-error: true
        run: '[ "$(date +%d)" -le 7 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ] && node tools/build-walk.mjs osm || echo "street network kept"'
      - name: Walks between stops
        run: node tools/build-walk.mjs stops
      - name: Check
        run: node tools/check-data.mjs
      - name: Commit
        id: commit
        run: |
          if git diff --quiet -- public/data; then echo "changed=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          node tools/stamp.mjs
          git config user.name "buss-data-bot"; git config user.email "actions@users.noreply.github.com"
          git add public && git commit -m "Timetable update $(date +%F)" && git push
          echo "changed=1" >> "$GITHUB_OUTPUT"
      - name: Deploy
        if: steps.commit.outputs.changed == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::warning::No CLOUDFLARE_API_TOKEN secret: data committed but not deployed"; exit 0; fi
          npx --yes wrangler@4 deploy
